<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/layout.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/forms.css" rel="stylesheet" />
    <link href="css/animations.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Home Button -->

    <div class="page-nav">
      <a href="index.html" class="btn btn-secondary-theme"> 🏠 Home </a>
    </div>

    <!-- Main Content -->

    <div class="container page-content">
      <h2 class="mb-4">Product Management</h2>
      <div class="card glass mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label"> Category </label>

              <select id="category" class="form-select"></select>
            </div>

            <div class="col-md-8">
              <label class="form-label"> Product Name </label>

              <input
                type="text"
                id="productName"
                class="form-control"
                placeholder="Enter Product Name"
              />
            </div>

            <div class="col-12">
              <label class="form-label"> Available Sizes </label>

              <div class="glass rounded p-3">
                <div id="sizeList"></div>

                <button
                  type="button"
                  class="btn btn-secondary-theme mt-3"
                  onclick="addSizeField()"
                >
                  + Add Size
                </button>
              </div>
            </div>

            <div class="next-button">
              <button
                class="btn btn-primary w-5"
                onclick="addProduct()"
              >
                Add Product
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="glass p-3 mb-4">
        <input
          type="text"
          id="productSearch"
          class="form-control"
          placeholder="Search Product..."
        />
      </div>

      <div class="glass p-3">
        <table class="table table-bordered table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th width="80">ID</th>

              <th>Product</th>

              <th width="140">Action</th>
            </tr>
          </thead>

          <tbody id="productTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Next Page Button -->

    <div class="next-button">
      <a href="stock.html" class="btn btn-primary-theme"> Stock Entry → </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>

    <script src="js/products.js"></script>
  </body>
</html>
