<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stock Entry</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/layout.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/forms.css" rel="stylesheet" />
    <link href="css/animations.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Home Button -->
    <div class="page-nav">
      <a href="index.html" class="btn btn-secondary-theme"> 🏠 Home </a>
    </div>

    <div class="container mt-5">
      <h2 class="mb-4">Stock Entry</h2>

      <!-- Entry Details -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label"> Entry Date </label>

              <input type="date" id="entryDate" class="form-control" />
            </div>

            <div class="col-md-3">
              <label class="form-label"> Category </label>

              <select id="category" class="form-select"></select>
            </div>

            <div class="col-md-6">
              <label class="form-label"> Remarks </label>

              <input
                type="text"
                id="remarks"
                class="form-control"
                placeholder="Optional remarks"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Stock Table -->
      <div class="card">
        <div class="card-body">
          <div class="table-container">
            <div class="table-responsive">
              <table class="table table-bordered align-middle text-center">
                <thead id="tableHead"></thead>

                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="text-end mt-4">
            <button class="btn btn-success" onclick="saveStock()">
              Save Stock
            </button>
          </div>
        </div>
      </div>

      <!-- Next Page Button -->

      <div class="next-button">
        <a href="stock-history.html" class="btn btn-primary-theme">
          Stock History →</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>

    <script src="js/stock.js"></script>
  </body>
</html>
